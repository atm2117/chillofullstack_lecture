<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            background-color: blue;
            color: white;
            display: block;
            margin-bottom: 10px;
            border: none;
        }
        .btn-blue {
            background-color: blue;
            color: white;
        }
        .btn-white {
            background-color: white;
            color: blue;
        }
        .btn-red {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <h1>DevOps</h1>
    <h2>Dev fullstack</h2>
    <h3>Formateur</h3>
    <h4>Dev Backend</h4>
    <button class="btn-blue">Je veux declarer une naissance</button>
    <button class="btn-white">Connexion</button>
    <button class="btn-red">Je veux suivre une demande</button>
</body>
</html>
